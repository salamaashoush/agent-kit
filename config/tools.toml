# The optional half of the setup. `install.sh` probes for each binary and wires
# only what this machine has, so the same clone works where none of them exist.
#
# Order matters: a host runs the hooks of one event in the order they appear in
# its own config, and the installer writes them in this file's order. `careful`
# stays first because it has to read the command as typed, before rtk rewrites it.
#
# `{home}` is the host's own config directory, `~/.claude` or `~/.codex`, so a
# hook command names the copy belonging to the host running it. A hook goes to
# both hosts under the same event name; `codex_event` renames it for Codex and
# `codex = false` withholds it, which is what an event only one host has needs.

[careful]
what = "Warns before rm -rf, DROP TABLE, force-push and other destructive commands."
skill = "careful"

[[careful.hooks]]
event = "PreToolUse"
matcher = "Bash"
command = "bash {home}/skills/careful/bin/check-careful.sh"
# Earlier installs named the clone path rather than the symlink, so a second
# entry would warn twice. Anything matching this is replaced rather than joined.
replaces = ["check-careful.sh"]

[rtk]
what = "Filters and summarises command output before it reaches the context."
probe = "rtk"
source = "https://github.com/rtk-ai/rtk"
doc = "tools/docs/rtk.md"

# `claude` names the payload shape rather than the host. Codex serialises the
# same `tool_name` and `tool_input.command`, so the one processor reads both;
# `rtk hook` grows a `codex` of its own the day the two stop agreeing.
[[rtk.hooks]]
event = "PreToolUse"
matcher = "Bash"
command = "rtk hook claude"

[ferridriver]
what = "Drives Chromium, Firefox and WebKit behind one Playwright-shaped API."
probe = "ferridriver"
source = "cargo install ferridriver"
doc = "tools/docs/ferridriver.md"

[ferridriver.mcp]
type = "stdio"
command = "ferridriver"
args = ["mcp"]

[statusline]
what = "Folder, branch, model and a context-usage bar, in one line."
probe = "jq"
source = "jq: brew install jq, or pacman -S jq"
# The script is symlinked next to the settings that name it, so the path in
# settings.json survives this clone moving. A Nerd Font renders the glyphs.
#
# Claude Code only. Codex's status line is a list of segments it renders itself
# rather than a script it runs, so there is nothing here for it to wire.
statusline = "tools/statusline.sh"

[herd]
what = "Runs the other Claude sessions on this machine, from a phone."
skill = "herd"

# Notification fires the moment a session blocks on a question or a permission
# prompt, and Stop when it finishes a turn. Recorded, `herd watch` hears about a
# session that stopped instead of finding it on some later poll, and a session
# with no pane can be waited on at all.
#
# Codex has no Notification. `PermissionRequest` is the half of it that matters
# here, being the one that fires while a session sits waiting for an answer.
[[herd.hooks]]
event = "Notification"
codex_event = "PermissionRequest"
command = "python3 {home}/herd-event.py"
async = true

[[herd.hooks]]
event = "Stop"
command = "python3 {home}/herd-event.py"
async = true
